
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | Vistula University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div>
            <h1>Task Manager</h1>
            <p>Organize your work. Get things done.</p>
        </div>
        <div class="student">
            Student ID: <span id="student-id">73809</span>
        </div>
    </header>

    <main class="container">

        <section class="form-section">
            <h2 id="form-heading">Create a New Task</h2>

            <form id="task-form">
                <label for="task-title">Task Title</label>
                <input
                    type="text"
                    id="task-title"
                    placeholder="Enter task title..."
                    required
                >

                <label for="task-description">Description</label>
                <textarea
                    id="task-description"
                    placeholder="Describe your task..."
                ></textarea>

                <div class="form-buttons">
                    <button type="submit" id="task-submit">
                        Add Task
                    </button>
                    <button type="button" id="cancel-edit" hidden>
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="tasks-section">
            <div class="section-heading">
                <h2>My Tasks</h2>
                <span id="task-count">Loading...</span>
            </div>

            <div id="task-list">
            </div>
        </section>

        <p id="status-message" role="status" aria-live="polite">
            Loading tasks...
        </p>

        <footer>
            <a id="contribution-link" href="contribution.html">
                View Team Contribution →
            </a>
            <p>Vistula University · Task Manager Project</p>
        </footer>

    </main>

    <script src="app.js"></script>
</body>
</html>
